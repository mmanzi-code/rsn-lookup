<html lang="en">
<head>

<title>Fubo RSN Lookup</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root {
  --text: #242424;
  --text-muted: #5a5a5a;
  --bg: #fcfcfc;
  --bg-card: #f6f6f5;
  --border: #e2e0dc;
  --accent: #e8640a;
  --accent-light: #fef3ea;
  --accent-border: #f5b37a;
  --chip-bg: #eeecea;
  --chip-text: #3d3b37;
  --input-bg: #ffffff;
  --shadow: rgba(36, 36, 36, 0.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --text: #e8e6e2;
    --text-muted: #a09c96;
    --bg: #1a1918;
    --bg-card: #252422;
    --border: #3a3835;
    --accent: #f0842e;
    --accent-light: #2e2118;
    --accent-border: #6b4020;
    --chip-bg: #33312e;
    --chip-text: #d4d1cc;
    --input-bg: #201f1e;
    --shadow: rgba(0, 0, 0, 0.2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --text: #e8e6e2;
  --text-muted: #a09c96;
  --bg: #1a1918;
  --bg-card: #252422;
  --border: #3a3835;
  --accent: #f0842e;
  --accent-light: #2e2118;
  --accent-border: #6b4020;
  --chip-bg: #33312e;
  --chip-text: #d4d1cc;
  --input-bg: #201f1e;
  --shadow: rgba(0, 0, 0, 0.2);
  color-scheme: dark;
}

body {
  font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  padding-inline: 16px;
  padding-block: 0;
  line-height: 1.5;
}

.lookup-wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 12px 24px;
}

h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.01em;
}
.subtitle {
  font-size: 0.95rem;
  color: var(--text-muted);
  margin: 0 0 20px;
}

.input-group {
  position: relative;
  margin-bottom: 16px;
}
.input-group input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 16px 12px 44px;
  font-family: inherit;
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  background: var(--input-bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  outline: none;
  transition: border-color 0.15s;
}
.input-group input:focus {
  border-color: var(--accent);
}
.input-group input::placeholder {
  color: var(--text-muted);
  opacity: 0.7;
}
.input-group .icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.toggle-row {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
}
.toggle-btn {
  flex: 1;
  padding: 9px 12px;
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  background: transparent;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  text-align: center;
}
.toggle-btn.active {
  background: var(--input-bg);
  color: var(--text);
  box-shadow: 0 1px 3px var(--shadow);
}

.results { display: none; }
.results.visible { display: block; }

.result-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}
.result-card .label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin: 0 0 8px;
}
.result-card .value {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--accent);
  margin: 0;
}
.result-card .body-text {
  font-size: 0.92rem;
  line-height: 1.55;
  color: var(--text);
  margin: 0;
}

.chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.chip {
  display: inline-block;
  padding: 5px 12px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--chip-text);
  background: var(--chip-bg);
  border-radius: 20px;
  white-space: nowrap;
}

.callout {
  display: none;
  background: var(--accent-light);
  border-left: 4px solid var(--accent);
  border-radius: 0 10px 10px 0;
  padding: 14px 16px 14px 14px;
  margin-bottom: 16px;
}
.callout.visible {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.callout .callout-icon {
  flex-shrink: 0;
  color: var(--accent);
  margin-top: 1px;
}
.callout p {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--text);
}

.message {
  display: none;
  text-align: center;
  padding: 24px 0;
  color: var(--text-muted);
  font-size: 0.95rem;
}
.message.visible { display: block; }

.zip-badge {
  display: inline-block;
  font-size: 0.8rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  background: var(--accent-light);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 16px;
  letter-spacing: 0.03em;
}

.caveat {
  font-size: 0.82rem;
  font-style: italic;
  color: var(--text-muted);
  margin: 0;
  padding-top: 4px;
  line-height: 1.45;
}
</style>

</div>

  var lookup = {};
  COMBOS.forEach(function(combo) {
    combo.z.split(',').forEach(function(r) {
      if (r.indexOf('-') !== -1) {
        var parts = r.split('-');
        var start = parseInt(parts[0], 10);
        var end = parseInt(parts[1], 10);
        for (var i = start; i <= end; i++) {
          lookup[String(i).padStart(5, '0')] = combo;
        }
      } else {
        lookup[r.padStart(5, '0')] = combo;
      }
    });
  });

  var zipInput = document.getElementById('zipInput');
  var notFound = document.getElementById('notFound');
  var results = document.getElementById('results');
  var zipBadge = document.getElementById('zipBadge');
  var callout = document.getElementById('callout');
  var calloutText = document.getElementById('calloutText');
  var feeCard = document.getElementById('feeCard');
  var feeLabel = document.getElementById('feeLabel');
  var feeText = document.getElementById('feeText');
  var channelsList = document.getElementById('channelsList');
  var teamsList = document.getElementById('teamsList');
  var baseCaveat = document.getElementById('baseCaveat');

  var currentPlan = 'base';

  document.querySelectorAll('.toggle-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.toggle-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentPlan = btn.dataset.plan;
      var zip = zipInput.value.replace(/\D/g, '');
      if (zip.length === 5) showResults(zip);
    });
  });

  zipInput.addEventListener('input', function() {
    var raw = zipInput.value.replace(/\D/g, '');
    zipInput.value = raw;
    hideAll();
    if (raw.length === 5) showResults(raw);
  });

  function hideAll() {
    notFound.classList.remove('visible');
    results.classList.remove('visible');
  }

  function showResults(zip) {
    var data = lookup[zip];
    if (!data) {
      hideAll();
      notFound.classList.add('visible');
      return;
    }
    hideAll();
    results.classList.add('visible');
    zipBadge.textContent = 'ZIP ' + zip;

    if (currentPlan === 'base') {
      // Base plan view
      var hasBase = (data.c && data.c.trim()) || (data.t && data.t.trim());
      feeLabel.textContent = 'Regional Sports Fee';
      if (hasBase) {
        feeText.textContent = 'Local and regional sports programming is included with your plan, and subject to a Regional Sports Fee. Find available teams and channels below. Visit our Virtual Assistant for more information about the Fee Amount.';
      } else {
        feeText.textContent = 'Local and regional sports programming is not available in your area, and your plan is not subject to a Regional Sports Fee.';
      }
      feeCard.hidden = false;
      renderChips(channelsList, data.c);
      renderChips(teamsList, data.t);
      callout.classList.remove('visible');
      baseCaveat.hidden = false;
    } else {
      // Sports + News view
      var hasAddon = (data.ac && data.ac.trim()) || (data.at && data.at.trim());

      feeLabel.textContent = 'My Local Sports Add-on';
      if (hasAddon) {
        feeText.innerHTML = 'This add-on is available in your area. Find channel and team information below. Visit <a href="https://www.fubo.tv/stream/my-local-sports/" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">fubo.tv</a> for pricing details.';
      } else {
        feeText.textContent = 'This add-on is not available in your area.';
      }
      feeCard.hidden = false;

      // Show callout if ao_exception exists
      if (data.e && data.e.trim()) {
        calloutText.textContent = data.e.trim();
        callout.classList.add('visible');
      } else {
        callout.classList.remove('visible');
      }

      renderChips(channelsList, data.ac || '');
      renderChips(teamsList, data.at || '');
      baseCaveat.hidden = true;
    }

    document.getElementById('channelsCard').hidden = channelsList.children.length === 0;
    document.getElementById('teamsCard').hidden = teamsList.children.length === 0;
  }

  function renderChips(container, csv) {
    container.innerHTML = '';
    if (!csv || !csv.trim()) return;
    csv.split(',').map(function(s) { return s.trim(); }).filter(Boolean).forEach(function(name) {
      var chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = name;
      container.appendChild(chip);
    });
  }
